<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArchEdit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,900&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/static/style.css?v=8">
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>ArchEdit</h1><p class="sub">Image editing for architecture and interiors</p></div>
    <div class="pills"><span class="pill" id="remaining" hidden></span><span class="pill" id="statusPill">…</span></div>
  </header>

  <div class="main">
    <aside class="panel" aria-label="Settings">
      <div class="field">
        <span class="lbl" id="toolsLbl">Tool</span>
        <div class="tools" id="tools" role="tablist" aria-labelledby="toolsLbl"></div>
        <p class="note" id="toolHint"></p>
      </div>
      <div class="field" id="scopeBox" hidden>
        <span class="lbl" id="scopeLbl">Apply to</span>
        <div class="seg2" role="group" aria-labelledby="scopeLbl">
          <button type="button" id="scopeWhole" aria-pressed="true">Whole image</button>
          <button type="button" id="scopeArea" aria-pressed="false">Brushed area</button>
        </div>
      </div>
      <div class="field" id="traceBox" hidden>
        <label class="check"><input type="checkbox" id="trace"> Trace a photo (start from a photo instead of a sketch)</label>
      </div>
      <div class="field" id="targetBox" hidden>
        <label for="target" id="targetLbl">Target</label>
        <input type="text" id="target" list="targetList" autocomplete="off">
        <datalist id="targetList"></datalist>
      </div>
      <div class="field">
        <span class="lbl" id="presetsLbl">Presets</span>
        <div class="chips" id="presets" role="group" aria-labelledby="presetsLbl"></div>
      </div>
      <div class="field">
        <label for="idea">Idea</label>
        <textarea id="idea" rows="2">Render this sketch as a warm Scandinavian living room</textarea>
        <button class="btn ghost" id="askClaude" title="Claude writes a prompt from your idea and the input image">Write prompt with Claude</button>
      </div>
      <div class="field">
        <label for="prompt">Prompt</label>
        <textarea id="prompt" rows="6"></textarea>
      </div>
      <div class="field" id="brushBox" hidden>
        <div class="row"><label for="brush">Brush</label><output id="brushOut">40</output></div>
        <input type="range" id="brush" min="8" max="160" value="40">
        <button class="btn ghost" id="clearMask" type="button">Clear area</button>
      </div>
      <div class="field" id="cannyBox" hidden>
        <div class="row"><label for="low">Line detail</label><output id="lowOut">100</output></div>
        <input type="range" id="low" min="10" max="250" value="100" title="Lower means more lines">
      </div>
      <div class="field">
        <label for="model">Model</label>
        <select id="model"></select>
      </div>
      <div class="two">
        <div class="field">
          <label for="size">Size</label>
          <select id="size"></select>
        </div>
        <div class="field">
          <label for="seed">Seed</label>
          <input type="number" id="seed" value="-1" title="-1 = random">
        </div>
      </div>
      <div class="field" id="stepsBox" hidden>
        <div class="row"><label for="steps">Steps</label><output id="stepsOut">20</output></div>
        <input type="range" id="steps" min="8" max="40" value="20">
      </div>
    </aside>

    <div class="stage">
      <section class="panel">
        <div class="plates">
          <figure>
            <figcaption><span>Input</span><span id="srcInfo"></span></figcaption>
            <div class="plate drop" id="drop" tabindex="0" role="button" aria-label="Upload image">
              <img id="srcImg" alt="" hidden><canvas id="srcCanvas" hidden></canvas><span class="empty" id="srcEmpty">+ Image</span>
            </div>
          </figure>
          <figure>
            <figcaption><span>Sent to model</span><span id="mapInfo"></span></figcaption>
            <div class="plate"><img id="mapImg" alt="" hidden><span class="empty" id="mapEmpty">—</span></div>
          </figure>
          <figure>
            <figcaption><span>Result</span><span id="outInfo"></span></figcaption>
            <div class="plate"><img id="outImg" alt="" hidden><span class="empty" id="outEmpty">—</span>
              <div class="progress" id="progress" hidden><div id="bar"></div></div>
            </div>
          </figure>
        </div>
        <input type="file" id="file" accept="image/*" hidden>
        <input type="file" id="styleFile" accept="image/*" hidden>
        <div class="btns">
          <button class="btn primary" id="generate">Generate</button>
          <button class="btn ghost" id="upload">Upload image</button>
          <button class="btn ghost" id="styleBtn" title="Pick an image to use as a style reference">Style image</button>
          <button class="btn ghost" id="useResult" title="Use the result as the new input and keep editing" hidden>Edit result</button>
          <a class="btn ghost" id="openOut" href="#" target="_blank" rel="noopener" hidden>Full size</a>
        </div>
        <p class="note" id="status" role="status"></p>
      </section>

      <section class="panel" id="historyPanel" hidden>
        <div class="history" id="history"></div>
      </section>
    </div>
  </div>
</div>
<script src="/static/app.js?v=9"></script>
</body>
</html>
